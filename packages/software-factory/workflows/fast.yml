# yaml-language-server: $schema=../schemas/workflow.schema.json
name: fast
description: Fast direct worker build with quality gate and direct delivery (for chores, docs, style)

sync:
  timeout: 2m
  exec:
    - git fetch origin

setup:
  timeout: 10m
  exec:
    - pnpm install --frozen-lockfile

agents:
  worker:
    role: worker
    runner: claude
    model: sonnet
    timeout: 40m
    headless: false
    permission: write

operator:
  role: operator
  runner: claude
  model: sonnet
  timeout: 20m
  headless: false
  permission: write

steps:
  - id: build
    type: agent
    agent: worker
    inputs: []

  - id: quality-gate
    type: commands
    timeout: 15m
    exec:
      - pnpm check-types
      - pnpm lint
      - pnpm test
    onFail:
      retry: build
      max: 3

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
