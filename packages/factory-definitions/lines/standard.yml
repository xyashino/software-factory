# yaml-language-server: $schema=../schemas/line.schema.json
schemaVersion: 2
name: standard
description: Direct builder build with quality gate and doctor audit (bypasses planning)

workspace:
  sync:
    timeout: 2m
    exec:
      - git fetch origin
  setup:
    timeout: 10m
    exec:
      - pnpm install --frozen-lockfile

operators:
  builder:
    profile: builder
    runner: claude
    model: sonnet
    timeout: 60m
    headless: false
    permission: write
  doctor:
    profile: doctor
    runner: claude
    model: sonnet
    timeout: 20m
    headless: false
    permission: read

stations:
  - id: build
    kind: operator
    operator: builder
    inputs: []
    requires: []

  - id: quality-gate
    kind: inspection
    timeout: 15m
    exec:
      - pnpm check-types
      - pnpm lint
      - pnpm test
    requires: []
    onFail:
      retry: build
      max: 3

  - id: audit
    kind: operator
    operator: doctor
    inputs:
      - build.report
      - build.commit
      - quality-gate.gate
    requires: []
    onFail:
      retry: build
      max: 2

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
