# yaml-language-server: $schema=../schemas/line.schema.json
schemaVersion: 2
name: feature
description: Plan, review the plan, build behind a quality gate, then audit

workspace:
  sync:
    timeout: 2m
    exec:
      - git fetch origin
  setup:
    timeout: 10m
    exec:
      - pnpm install --frozen-lockfile

operators:
  planner:
    profile: planner
    runner: claude
    model: sonnet
    timeout: 20m
    headless: false
    permission: write
  plan-reviewer:
    profile: plan-reviewer
    runner: cursor
    model: cursor-grok-4.5-medium
    timeout: 10m
    headless: false
    permission: write
  builder:
    profile: builder
    runner: claude
    model: haiku
    timeout: 60m
    headless: false
    permission: write
  doctor:
    profile: doctor
    runner: cursor
    model: gpt-5.6-luna-medium
    timeout: 20m
    headless: false
    permission: read

stations:
  - id: plan
    kind: operator
    operator: planner
    inputs: []
    requires: []

  - id: plan-review
    kind: operator
    operator: plan-reviewer
    inputs:
      - plan.plan
    requires: []
    onFail:
      retry: plan
      max: 2

  - id: build
    kind: operator
    operator: builder
    inputs:
      - plan.plan
    requires: []

  - id: quality-gate
    kind: inspection
    timeout: 15m
    exec:
      - pnpm check-types
      - pnpm lint
      - pnpm test
    requires: []
    onFail:
      retry: build
      max: 3

  - id: audit
    kind: operator
    operator: doctor
    inputs:
      - plan.plan
      - build.report
      - build.commit
      - quality-gate.gate
    requires: []
    onFail:
      retry: build
      max: 2

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
