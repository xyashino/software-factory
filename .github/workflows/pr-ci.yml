name: PR CI

'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run verification gate
        run: pnpm exec turbo run //#format:check lint check-types test build --ui=stream

      # The factory-operator startup budget is skipped inside turbo (CPU contention); enforce it alone here.
      - name: Operator CLI startup budget
        run: pnpm --filter @repo/factory-operator-cli test

  # The distributed suite (ROADMAP v2-15): real Factory and Cell processes, a fake runner, a hostile proxy.
  # Manual only (Actions > PR CI > Run workflow): it is slow and timing-sensitive, so it does not gate PRs.
  distributed:
    name: distributed suite
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run the distributed suite
        run: pnpm --filter @repo/factory-cell test:distributed

  # The soak: the same suite, 20 times in a row on one runner. One flake fails the job (no retries).
  # Manual only, like `distributed`.
  distributed-soak:
    name: distributed soak (20 runs)
    timeout-minutes: 240
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run the distributed suite 20 times
        shell: bash
        run: |
          set -o pipefail
          for run in $(seq 20); do
            echo "== distributed run ${run} of 20"
            pnpm --filter @repo/factory-cell test:distributed 2>&1 | tee "distributed-run-${run}.log" || {
              echo "flake on run ${run}: the suite failed"
              exit 1
            }
          done
