name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build web UI
        run: |
          bun --filter @repo/web-demo build
          node scripts/deploy-web-deps.mjs

      - name: Package web UI
        run: |
          mkdir -p release/stage/web
          cp -a apps/web-demo/dist/server apps/web-demo/dist/client release/stage/web/
          cp -a apps/web-demo/dist/sf-deps/node_modules release/stage/web/
          tar -czf release/sf-web-${{ matrix.target }}.tar.gz -C release/stage web
          rm -rf release/stage

      - name: Compile sf
        working-directory: apps/sf
        run: bun build --compile --target=bun-${{ matrix.target }} src/cli.ts --outfile ../../release/sf-${{ matrix.target }}

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: sha256sum sf-* > SHA256SUMS

      - name: Create GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes sf-* SHA256SUMS
