# yaml-language-server: $schema=../schemas/line.schema.json
name: standard
description: Direct builder build with quality gate and doctor audit (bypasses planning)

workspace:
  sync:
    timeout: 2m
    exec:
      - git fetch origin
  setup:
    timeout: 10m
    exec:
      - pnpm install --frozen-lockfile
      - pnpm run --if-present nitpick:sync

operators:
  builder:
    profile: builder
    runner: claude
    model: sonnet
    timeout: 60m
    headless: false
    permission: write
  doctor:
    profile: doctor
    runner: claude
    model: sonnet
    timeout: 20m
    headless: false
    permission: read

stations:
  - id: build
    kind: operator
    operator: builder
    inputs: []

  - id: quality-gate
    kind: inspection
    timeout: 15m
    exec:
      # The commit hook's own check (`ci:verify`, the same one husky pre-commit runs), so the tests run once here.
      # The decision-log ADR is checked at delivery (`requireAdr`), not here: it needs a staged file this gate does not make.
      - pnpm ci:verify
    onFail:
      retry: build
      max: 3

  - id: audit
    kind: operator
    operator: doctor
    inputs:
      - build.report
      - build.commit
      - quality-gate.gate
    onFail:
      retry: build
      max: 2

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
  requireAdr: true
