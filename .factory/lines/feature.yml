# yaml-language-server: $schema=../schemas/line.schema.json
name: feature
description: Plan, review the plan, build behind a quality gate, then audit

workspace:
  sync:
    timeout: 2m
    exec:
      - git fetch origin
  setup:
    timeout: 10m
    exec:
      - pnpm install --frozen-lockfile
      - pnpm run --if-present nitpick:sync

operators:
  planner:
    profile: planner
    runner: claude
    model: haiku
    timeout: 20m
    headless: false
    permission: write
  builder:
    profile: builder
    runner: claude
    model: haiku
    timeout: 60m
    headless: false
    permission: write
  doctor:
    profile: doctor
    runner: antigravity
    model: gemini-3.8-flash-medium
    timeout: 20m
    headless: false
    permission: read

stations:
  - id: plan
    kind: operator
    operator: planner
    inputs: []

  - id: build
    kind: operator
    operator: builder
    inputs:
      - plan.plan

  - id: quality-gate
    kind: inspection
    timeout: 15m
    exec:
      # The commit hook's own check (`ci:verify`, the same one husky pre-commit runs), so the tests run once here.
      # The decision-log ADR is checked at delivery (`requireAdr`), not here: it needs a staged file this gate does not make.
      - pnpm ci:verify
    onFail:
      retry: build
      max: 3

  - id: audit
    kind: operator
    operator: doctor
    inputs:
      - plan.plan
      - build.report
      - build.commit
      - quality-gate.gate
    onFail:
      retry: build
      max: 2

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
  requireAdr: true
