# yaml-language-server: $schema=../schemas/line.schema.json
name: fast
description: Fast direct builder build with quality gate and direct delivery (for chores, docs, style)

workspace:
  sync:
    timeout: 2m
    exec:
      - git fetch origin
  setup:
    timeout: 10m
    exec:
      - pnpm install --frozen-lockfile
      - pnpm run --if-present nitpick:sync

operators:
  builder:
    profile: builder
    runner: claude
    model: haiku
    timeout: 40m
    headless: false
    permission: write

mechanic:
  profile: mechanic
  runner: antigravity
  model: gemini-3.8-flash-medium
  timeout: 20m
  headless: false
  permission: read

stations:
  - id: build
    kind: operator
    operator: builder
    inputs: []

  - id: quality-gate
    kind: inspection
    timeout: 15m
    exec:
      - pnpm ci:verify
    onFail:
      retry: build
      max: 3

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
