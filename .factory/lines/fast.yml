# yaml-language-server: $schema=../schemas/line.schema.json
schemaVersion: 2
name: fast
description: Fast direct builder build with quality gate and direct delivery (for chores, docs, style)

workspace:
  sync:
    timeout: 2m
    exec:
      - git fetch origin
  setup:
    timeout: 10m
    exec:
      - pnpm install --frozen-lockfile
      - pnpm run --if-present nitpick:sync

operators:
  builder:
    profile: builder
    runner: claude
    model: sonnet
    timeout: 40m
    headless: false
    permission: write

stations:
  - id: build
    kind: operator
    operator: builder
    inputs: []

  - id: quality-gate
    kind: inspection
    timeout: 15m
    exec:
      # The dry run of the commit hook: the same `ci:verify` husky runs, so the tests run once here and not again at delivery.
      - pnpm ci:verify
      - pnpm nitpick:check
    onFail:
      retry: build
      max: 3

deliver:
  commit: build.commit
  report: build.report
  to: new-pr
